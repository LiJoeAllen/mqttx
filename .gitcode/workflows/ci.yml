# GitCode（AtomGit Action）流水线：master 推送与手动触发，Linux 上跑 fmt + 单测。
#
# 与 GitHub Actions 的分工：质量闸门以 .github/workflows/release.yml 为准，
# 这里只保证 GitCode 镜像自身可构建、可测试。
#
# 平台差异（踩坑记录）：
#   1. 工作流文件必须在 .gitcode/workflows/（不是 .github/workflows/），
#      语法与 GitHub Actions 相近但插件名不同：uses: checkout（无 actions/ 前缀）。
#   2. 官方托管 Runner 只有 Linux（ubuntu-latest），Windows/macOS 构建仍走 GitHub。
#   3. 没有 actions-rust-lang/setup-rust-toolchain，用 rustup 装 stable；
#      构建机在国内，rustup/crates 走 rsproxy.cn 镜像。
#   4. 不支持 GitHub 的 $GITHUB_PATH 写环境，每个 cargo 步骤先 . "$HOME/.cargo/env"。
name: CI

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

jobs:
  ci:
    name: 检查与测试 (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: checkout

      # 只缓存 ~/.cargo（registry + git），不缓存 target：GPUI 的 target 目录
      # 动辄数 GB，超过缓存上限反而拖慢每次构建。
      - name: Cache cargo
        uses: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # 系统依赖与 .github/workflows/release.yml 的 Linux 清单一致；
      # libfontconfig1-dev 在 20.04/22.04 上都存在。
      - name: Install Linux system deps (GPUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libasound2-dev libfontconfig1-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Install Rust toolchain (rsproxy mirror)
        run: |
          export RUSTUP_DIST_SERVER=https://rsproxy.cn
          export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
          curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
            | sh -s -- -y --default-toolchain stable --profile minimal
          mkdir -p ~/.cargo
          cat > ~/.cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'rsproxy-sparse'
          [source.rsproxy-sparse]
          registry = "sparse+https://rsproxy.cn/index/"
          [net]
          git-fetch-with-cli = true
          EOF

      - name: rustfmt check
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --all --check

      # --tests：让 tests/engine_live.rs 参与编译（#[ignore] 只跳过执行，不跳过编译）
      - name: Unit tests
        run: |
          . "$HOME/.cargo/env"
          cargo test -p mqttx-desktop --lib --tests
