# Gitee Go 流水线：推送 v* tag 时构建 Linux 产物并暂存为流水线制品。
#
# 与 GitHub 的分工：发布/OTA 只走 GitHub Release（客户端 update 模块的源头），
# 这里只在 Gitee 镜像上留一份 Linux 构建产物供验证，不发布 Gitee Release。
# 产物命名沿用 OTA 约定：mqttx-v<ver>-<triple>-mqttx[.exe][.sha256]。
#
# 平台限制（踩坑记录，详见 master-ci.yml 头注释）：
#   - Gitee Go 没有暴露"当前 tag 名"的系统变量（GITEE_BRANCH 只给分支），
#     所以版本号直接从 gpui-app/Cargo.toml 解析（单一真源）；
#     tag 与 Cargo.toml 的一致性校验由 GitHub Actions 在正式发布时把守。
#   - 制品仅暂存不上传制品库，7 天后自动清除（官方 artifacts 行为）。
version: '1.0'
name: tag-build
displayName: 构建（tag 推送）
triggers:
  push:
    tags:
      prefix:
        - v
stages:
  - stage:
      name: build
      displayName: 构建 Linux 产物
      strategy: naturally
      trigger: auto
      steps:
        - step: build@gcc
          name: rust_build
          displayName: release 构建并打包命名产物
          gccVersion: 10.3
          commands:
            - |
              set -eu
              apt-get update
              apt-get install -y --no-install-recommends \
                libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
                libwayland-dev libasound2-dev libfontconfig1-dev \
                libx11-dev libxcursor-dev libxrandr-dev libxi-dev
              export RUSTUP_DIST_SERVER=https://rsproxy.cn
              export RUSTUP_UPDATE_ROOT=https://rsproxy.cn/rustup
              curl --proto '=https' --tlsv1.2 -sSf https://rsproxy.cn/rustup-init.sh \
                | sh -s -- -y --default-toolchain stable --profile minimal
              . "$HOME/.cargo/env"
              mkdir -p "$HOME/.cargo"
              cat > "$HOME/.cargo/config.toml" <<'EOF'
              [source.crates-io]
              replace-with = 'rsproxy-sparse'
              [source.rsproxy-sparse]
              registry = "sparse+https://rsproxy.cn/index/"
              [net]
              git-fetch-with-cli = true
              EOF
              ver="$(grep -m1 '^version' gpui-app/Cargo.toml | cut -d'"' -f2)"
              if [ -z "$ver" ]; then
                echo "无法从 gpui-app/Cargo.toml 解析版本号" >&2
                exit 1
              fi
              echo "版本：v${ver}"
              cargo build --release -p mqttx-desktop
              mkdir -p dist
              dst="dist/mqttx-v${ver}-x86_64-unknown-linux-gnu-mqttx"
              cp target/release/mqttx "$dst"
              sha256sum "$dst" > "$dst.sha256"
              ls -la dist/
          artifacts:
            - name: BUILD_ARTIFACT
              path:
                - ./dist
